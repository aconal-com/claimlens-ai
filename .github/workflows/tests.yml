name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal test deps
        # The 27 existing tests only exercise the deterministic logic
        # (rules_engine, decision_engine, fusion). They never instantiate
        # Florence-2, torch, pytesseract, pdf2image, or the Ollama clients,
        # so we skip the heavy vision/ML deps and keep CI under ~1 minute.
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings python-dotenv pytest pytest-asyncio

      - name: Run tests
        run: pytest -v